[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semop-local-4060"
version = "0.1.0"
description = "Verifier-first typed operator reasoning experiments for ordinary PCs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
controller = ["numpy>=1.26,<3"]
train = ["numpy>=1.26,<3", "torch>=2.2"]
vision = ["Pillow>=10"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
